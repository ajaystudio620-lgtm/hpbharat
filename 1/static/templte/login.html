<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - GASHPBHARAT</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f7fb;
}


.login-box{

    width:90%;
    max-width:420px;
    margin:70px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    text-align:center;

}


.logo{

    font-size:35px;
    color:#ff7800;
    font-weight:bold;

}


input{

    width:90%;
    padding:14px;
    margin:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;

}


button{

    width:95%;
    padding:14px;
    background:#ff7800;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;

}


button:hover{

    background:#e56700;

}


a{

    color:#0066ff;
    text-decoration:none;

}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">
🔥 GASHPBHARAT
</div>


<h2>
Customer Login
</h2>


<form method="POST" action="/login">


<input 
type="tel"
name="mobile"
placeholder="Enter Mobile Number"
required>


<input 
type="password"
name="password"
placeholder="Enter Password"
required>


<button type="submit">
Login
</button>


</form>


<p>
New Customer?
<a href="/register">
Create Account
</a>
</p>


</div>


</body>

</html>
