<!DOCTYPE html>
<html>

<head>

<title>Track Booking - GASHPBHARAT</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{

margin:0;
font-family:Arial;
background:#f5f7fb;

}


.box{

width:90%;
max-width:450px;
margin:50px auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px #ccc;
text-align:center;

}


h1{

color:#ff7800;

}


input{

width:90%;
padding:12px;
margin:10px;
border-radius:10px;
border:1px solid #ccc;

}


button{

background:#ff7800;
color:white;
border:none;
padding:13px 30px;
border-radius:25px;

}


.status{

margin-top:20px;
background:#f1f1f1;
padding:15px;
border-radius:10px;

}


</style>

</head>


<body>


<div class="box">


<h1>
🚚 Track Booking
</h1>


<p>
Enter your booking number
</p>



<form method="POST">


<input 
type="text"
name="booking_number"
placeholder="GAS123456"
required>


<br>


<button type="submit">
Track Now
</button>


</form>


<div class="status">

<p>
Booking Status: Ready for Delivery
</p>

<p>
Delivery Partner: Assigned
</p>

</div>


</div>


</body>

</html>
